name: Storybook

on:
    push:
        branches:
            - main
    workflow_dispatch:

# A published Storybook is the visual review surface for the components; it is
# rebuilt from main rather than from a release, so a merged change is visible
# before it is versioned.
permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time, and never a cancelled one.
#
# `cancel-in-progress: true` is right for a build and wrong for a deploy. A
# run that is cancelled after it has opened a Pages deployment leaves that
# deployment behind, and it ends up in `error` while the next run contends
# with it - which is exactly what four merges in five minutes produced:
# two failed deployments and a Deploy job that hung for minutes on a build
# that had finished in 38 seconds.
#
# `false` is what GitHub's own Pages workflow uses, for this reason. Nothing
# is wasted by it: runs queued behind the in-flight one still collapse to the
# latest, so intermediate commits are skipped rather than deployed in turn.
concurrency:
    group: storybook-pages
    cancel-in-progress: false

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci
              env:
                  HUSKY: 0

            - name: Build Storybook
              run: npm run build-storybook

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: storybook-static

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        # Without this the job inherits the six-hour default, and a Pages
        # deployment that hangs - as 6572553280 did, for far longer than the
        # 38 seconds its build took - holds the concurrency group for the rest
        # of the day. That matters more now the group no longer cancels:
        # later runs queue behind a stuck deployment instead of replacing it,
        # so a hang has to fail on its own and free the lane.
        timeout-minutes: 10
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
