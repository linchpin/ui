name: Storybook

on:
    push:
        branches:
            - main
    workflow_dispatch:

# A published Storybook is the visual review surface for the components; it is
# rebuilt from main rather than from a release, so a merged change is visible
# before it is versioned.
permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: storybook-pages
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci
              env:
                  HUSKY: 0

            - name: Build Storybook
              run: npm run build-storybook

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: storybook-static

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
